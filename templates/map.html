<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub City Bus Tracker v2</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <!-- <script src="https://unpkg.com/leaflet@latest/dist/leaflet.js"></script> -->
    <!-- <script src="https://unpkg.com/leaflet-providers@latest/leaflet-providers.js"></script> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="top-header">
        <h1 class="app-title">Hub City Transit v2</h1>
    </header>
    
    <div class="mobile-toggles">
        <button id="routesPanelToggle" class="panel-toggle">
            <i class="fas fa-route"></i>
        </button>
        <button id="stopsPanelToggle" class="panel-toggle">
            <i class="fas fa-map-marker-alt"></i>
        </button>
    </div>
    
    <div id="routesPanel" class="side-panel">
        <h3>Routes</h3>
        <div id="route-buttons" class="panel-content"></div>
    </div>
    
    <div id="stopsPanel" class="side-panel">
        <h3>Stops</h3>
        <div id="stop-buttons" class="panel-content"></div>
    </div>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <div class="bottom-controls">
        <select id="busSelect" onchange="changeBusTracking()">
            <option value="">Select a bus</option>
            <option value="blue1">Blue Bus 1</option>
            <option value="blue2">Blue Bus 2</option>
            <option value="gold1">Gold Bus 1</option>
            <option value="gold2">Gold Bus 2</option>
            <option value="green">Green Bus</option>
        </select>
        <button id="updateETABtn" onclick="updateETA()">Update ETA</button>
        <div id="eta-display"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
